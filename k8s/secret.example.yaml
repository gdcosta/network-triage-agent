# TEMPLATE — do not commit a filled-in copy of this file.
#
# Every Secret the net-triage-agent namespace Deployments reference
# (k8s/deployment.yaml -> Deployment `kl-triage-agent`,
#  k8s/triage-mcp.yaml  -> Deployment `triage-mcp`).
# Key names verified against the live cluster 2026-11-12; ALL VALUES BELOW ARE
# PLACEHOLDERS.
#
#   Secret                       Keys                                  Consumed by
#   ---------------------------  ------------------------------------  ---------------------------------------------
#   kl-triage-secrets            ANTHROPIC_API_KEY, OPENAI_API_KEY,    kl-triage-agent / container `triage-agent`
#                                TEAMS_WEBHOOK_URL                     (envFrom)
#   kl-sidecar-splunk-secrets    SPLUNK_MCP_COMMAND, SPLUNK_MCP_ARGS,  kl-triage-agent / container
#                                SPLUNK_MCP_ENV                        `defenseclaw-sidecar` (envFrom) — the sidecar
#                                                                      runs the Splunk MCP bridge (mcp_proxy.py); the
#                                                                      agent container holds NO Splunk credentials
#   kl-defenseclaw-secrets       SPLUNK_HEC_TOKEN                      kl-triage-agent / `defenseclaw-sidecar` AND
#                                                                      triage-mcp / `defenseclaw-sidecar` (envFrom) —
#                                                                      audit_sinks HEC push
#   kl-triage-mcp-secrets        TRIAGE_MCP_SPLUNK_COMMAND,            triage-mcp / container `triage-mcp` (envFrom)
#                                TRIAGE_MCP_SPLUNK_ARGS,               — points at the Splunk that holds the agent's
#                                TRIAGE_MCP_SPLUNK_TOOL_NAME           own logs/alert history (a DIFFERENT Splunk
#                                                                      than the telemetry one above)
#   kl-vllm-secrets              VLLM_API_KEY                          kl-triage-agent / `defenseclaw-sidecar`
#                                                                      (secretKeyRef, optional: true) — the LLM shim
#                                                                      sends it to the self-hosted vLLM box; absent
#                                                                      => shim sends no Authorization header
#
# Note: the agent container only needs the LLM keys + webhook. SPLUNK_MCP_* are
# NOT read from kl-triage-secrets any more (older versions of this file put them
# there) — they moved to kl-sidecar-splunk-secrets. A stray SPLUNK_MCP_* key in
# kl-triage-secrets is harmless but unused.
#
# Two ways to create the real Secrets:
#
#  A) Imperatively (recommended — nothing on disk):
#       kubectl create secret generic kl-triage-secrets -n net-triage-agent \
#         --from-literal=ANTHROPIC_API_KEY='sk-ant-...' \
#         --from-literal=OPENAI_API_KEY='sk-...' \
#         --from-literal=TEAMS_WEBHOOK_URL='https://...'
#       kubectl create secret generic kl-sidecar-splunk-secrets -n net-triage-agent \
#         --from-literal=SPLUNK_MCP_COMMAND='npx' \
#         --from-literal=SPLUNK_MCP_ARGS='-y mcp-remote https://<splunk-mcp-host>:8089/services/mcp --header "Authorization: Bearer <token>"' \
#         --from-literal=SPLUNK_MCP_ENV='NODE_TLS_REJECT_UNAUTHORIZED=0'
#       kubectl create secret generic kl-defenseclaw-secrets -n net-triage-agent \
#         --from-literal=SPLUNK_HEC_TOKEN='<hec-token>'
#       kubectl create secret generic kl-triage-mcp-secrets -n net-triage-agent \
#         --from-literal=TRIAGE_MCP_SPLUNK_COMMAND='npx' \
#         --from-literal=TRIAGE_MCP_SPLUNK_ARGS='-y mcp-remote https://<log-splunk-mcp-host>:8089/services/mcp --header "Authorization: Bearer <token>"' \
#         --from-literal=TRIAGE_MCP_SPLUNK_TOOL_NAME='splunk_run_query'
#       kubectl create secret generic kl-vllm-secrets -n net-triage-agent \
#         --from-literal=VLLM_API_KEY='<vllm-token>'      # optional
#
#  B) Copy this file to secret.yaml (gitignored), fill in stringData, then:
#       kubectl apply -f k8s/secret.yaml
#
# The *_MCP_ARGS values are the same strings as in the local .env — the image
# bakes in `mcp-remote`, so `npx -y mcp-remote ...` resolves the global install
# with no registry fetch at pod start.
#
# After changing any Secret: `kubectl rollout restart` the Deployment(s) that
# consume it (env from a Secret is fixed at container start).
---
apiVersion: v1
kind: Secret
metadata:
  name: kl-triage-secrets
  namespace: net-triage-agent
type: Opaque
stringData:
  # LLM provider keys. ANTHROPIC_API_KEY is required at startup; OPENAI_API_KEY
  # is required only when the live provider is `openai` (see kl-triage-config).
  ANTHROPIC_API_KEY: "<REDACTED>"
  OPENAI_API_KEY: "<REDACTED>"
  # Teams Power Automate / incoming-webhook URL the agent posts AdaptiveCards to.
  TEAMS_WEBHOOK_URL: "<REDACTED>"
---
apiVersion: v1
kind: Secret
metadata:
  name: kl-sidecar-splunk-secrets
  namespace: net-triage-agent
type: Opaque
stringData:
  # Splunk MCP bridge for the agent's telemetry queries (runs in the sidecar).
  SPLUNK_MCP_COMMAND: "npx"
  SPLUNK_MCP_ARGS: '-y mcp-remote https://splunk-mcp.example.com:8089/services/mcp --header "Authorization: Bearer <REDACTED>"'
  SPLUNK_MCP_ENV: "NODE_TLS_REJECT_UNAUTHORIZED=0"
---
apiVersion: v1
kind: Secret
metadata:
  name: kl-defenseclaw-secrets
  namespace: net-triage-agent
type: Opaque
stringData:
  # Splunk HEC token the DefenseClaw sidecars use to push audit events.
  SPLUNK_HEC_TOKEN: "<REDACTED>"
---
apiVersion: v1
kind: Secret
metadata:
  name: kl-triage-mcp-secrets
  namespace: net-triage-agent
type: Opaque
stringData:
  # Splunk MCP bridge for triage-mcp (alert history / agent state lookups).
  TRIAGE_MCP_SPLUNK_COMMAND: "npx"
  TRIAGE_MCP_SPLUNK_ARGS: '-y mcp-remote https://log-splunk-mcp.example.com:8089/services/mcp --header "Authorization: Bearer <REDACTED>"'
  TRIAGE_MCP_SPLUNK_TOOL_NAME: "splunk_run_query"
---
apiVersion: v1
kind: Secret
metadata:
  name: kl-vllm-secrets
  namespace: net-triage-agent
type: Opaque
stringData:
  # Optional (secretKeyRef optional: true). Only needed if the self-hosted vLLM
  # box enforces an API key; leave the Secret out if it is keyless.
  VLLM_API_KEY: "changeme-vllm-api-key"
